tokio = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
ratatui = "0.30.2"

[dev-dependencies]
plaesy-tasks = { path = "../../support/tasks", features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
