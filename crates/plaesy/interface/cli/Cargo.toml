[package]
name = "plaesy-interface-cli"
version = "0.0.1"
edition = "2021"
rust-version = "1.92"
license = "MIT"
publish = false
description = "Antarmuka baris perintah (ADR 0003: interface/cli)."

[dependencies]
plaesy-adapter-sqlite = { path = "../../adapter/sqlite" }
plaesy-adapter-runstore = { path = "../../adapter/runstore" }
plaesy-domain-workflow = { path = "../../domain/workflow" }
