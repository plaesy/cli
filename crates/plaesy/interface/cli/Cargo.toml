[package]
name = "plaesy-interface-cli"
version = "0.0.1"
edition = "2021"
rust-version = "1.92"
license = "MIT"
publish = false
description = "Antarmuka baris perintah (ADR 0003: interface/cli)."

[dependencies]
plaesy-adapter-sqlite = { path = "../../adapter/sqlite" }
plaesy-interface-acp = { path = "../acp" }
plaesy-adapter-model-ollama = { path = "../../adapter/model-ollama" }
plaesy-adapter-memory = { path = "../../adapter/memory" }
plaesy-adapter-relay = { path = "../../adapter/relay" }
plaesy-analysis = { path = "../../support/analysis" }
plaesy-common = { path = "../../support/common" }
plaesy-designlint = { path = "../../support/designlint" }
plaesy-loop = { path = "../../support/loop" }
plaesy-mdlint = { path = "../../support/mdlint" }
plaesy-tasks = { path = "../../support/tasks" }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
plaesy-tasks = { path = "../../support/tasks", features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
