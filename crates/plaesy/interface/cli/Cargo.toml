plaesy-adapter-codegen-go = { path = "../../adapter/codegen-go" }
plaesy-adapter-import-sql = { path = "../../adapter/import-sql" }
plaesy-adapter-import-code-rust = { path = "../../adapter/import-code-rust" }
plaesy-adapter-import-code-python = { path = "../../adapter/import-code-python" }
plaesy-domain-api = { path = "../../domain/api" }
rusqlite = { workspace = true }
plaesy-interface-acp = { path = "../acp" }
plaesy-adapter-model-ollama = { path = "../../adapter/model-ollama" }
plaesy-adapter-model-openai-tools = { path = "../../adapter/model-openai-tools" }
plaesy-adapter-memory = { path = "../../adapter/memory" }
plaesy-adapter-relay = { path = "../../adapter/relay" }
plaesy-analysis = { path = "../../support/analysis" }
plaesy-common = { path = "../../support/common" }
plaesy-designlint = { path = "../../support/designlint" }
