# Virtual manifest: the Plaesy packages live under crates/plaesy/ (ADR 0003).
# Shared versions are declared once in [workspace.dependencies]; members inherit them.

[workspace]
resolver = "2"
members = [
    "crates/plaesy/interface/client",
    "crates/plaesy/adapter/design-ir",
    "crates/plaesy/adapter/memory",
    "crates/plaesy/adapter/relay",
    "crates/plaesy/adapter/runstore",
    "crates/plaesy/adapter/sqlite",
    "crates/plaesy/interface/http",
    "crates/plaesy/interface/mcp",
    "crates/plaesy/interface/ws",
    "crates/plaesy/adapter/sync",
    "crates/plaesy/adapter/http-client",
    "crates/plaesy/adapter/import-sql",
    "crates/plaesy/adapter/import-code-rust",
    "crates/plaesy/plugin/sdk",
    "crates/plaesy/adapter/codegen-js",
    "crates/plaesy/adapter/codegen-go",
    "crates/plaesy/interface/acp",
    "crates/plaesy/adapter/runtime",
    "crates/plaesy/domain/api",
    "crates/plaesy/domain/app",
    "crates/plaesy/domain/data",
    "crates/plaesy/domain/design",
    "crates/plaesy/domain/flow",
    "crates/plaesy/domain/identity",
    "crates/plaesy/domain/workflow",
    "crates/plaesy/dto",
    "crates/plaesy/interface/cli",
    "crates/plaesy/kernel",
    "crates/plaesy/plaesy",
    "crates/plaesy/service",
    "crates/plaesy/support/analysis",
    "crates/plaesy/support/common",
    "crates/plaesy/support/designlint",
    "crates/plaesy/support/loop",
    "crates/plaesy/support/mdlint",
    "crates/plaesy/support/tasks",
]
default-members = ["crates/plaesy/plaesy"]

[workspace.dependencies]
axum = { version = "0.8", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.26"
syn = { version = "2", features = ["full", "extra-traits", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals"] }
dioxus-ssr = { version = "=0.7.10" }
dirs = "5"
filetime = "0.2.29"
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "io", "sink"] }
indexmap = { version = "2", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
laya-decision = { path = "vendor/laya-decision", version = "=0.2.20" }
libc = "0.2.191"
lru = "0.12"
notify = { version = "8", features = ["macos_fsevent"] }
ort = { version = "2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-31"] }
parking_lot = "0.12"
proptest = "1.4"
pulldown-cmark = "0.12"
quick-xml = "0.37"
regex = "1"
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.8"
thiserror = "1.0"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
usearch = { version = "2.15", default-features = false }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects"] }
winreg = "0.52"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 1

[workspace.lints.rust]
# Shared lints for every member (inherit with `[lints] workspace = true`).
unsafe_op_in_unsafe_fn = "warn"

# esaxx-rs hard-codes a static MSVC CRT (/MT), which conflicts with the /MD objects of ort/cxx on Windows.
[patch.crates-io]
esaxx-rs = { path = "vendor/esaxx-rs" }
